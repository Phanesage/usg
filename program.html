<!doctype html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kompleksowe Badanie Moszny - program</title>
    <link rel="stylesheet" href="base.css">
        <style>
        body {
            background-image: url('miod.jpg');
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            min-height: 100vh;
            margin: 0;
        }
    .teczowy-tekst {
    font-weight: bold;
    animation: zmiana-koloru 3s infinite;
    }
    .zmkolor {
    font-weight: bold;
    animation: zmiana-koloru 3s infinite;
    }

    .program-intro {
    background-size: cover;
    background-repeat: no-repeat;
    background-position: center;
    padding: 2rem 1.5rem;
    border-radius: 8px;
    .ramka {
    max-width: 420px;
    padding: 20px 24px;
    border: 2px solid black;
    border-radius: 14px;
    font-family: sans-serif;
  }
}

@keyframes zmiana-koloru {
    0%   { color: red; }
    33%  { color: orange; }
    66%  { color: green; }
    100% { color: red; }
}
@keyframes zmkolor {
    0%   { color: red; }
    33%  { color: orange; }
    66%  { color: chocolate; }
    100% { color: magenta; }
}
 table{
    background-color: chocolate;
    border-radius: 5px;
    border-color: black;
    border-width: 5px;
    border: 2px solid black;
 }
 img{
    border-radius: 10px;
    border: 5px dashed black;
 }
    </style>
</head>
<body>
    <header>
        <h1>Kompleksowe Badanie Moszny</h1>
    </header>
    <nav aria-label="Główna">
        <a href="index.html">GŁÓWNA</a>
        <a href="info.html">INFO</a>
    </nav>
    <main>
        <section class="program-intro">
            <h2>Harmonogram wydarzenia</h2>
            <table>
                <thead>
                    <tr>
                        <th>Godzina</th>
                        <th>Atrakcja</th>
                        <th>Miejsce</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>10:00</td>
                        <td>Badanie wstępne</td>
                        <td>Gabinet 1</td>
                    </tr>
                    <tr>
                        <td>12:00</td>
                        <td>USG</td>
                        <td>Gabinet 7w</td>
                    </tr>
                    <tr>
                        <td>13:00</td>
                        <td>Konsultacja wyników</td>
                        <td>Gabinet 21w</td>
                    </tr>
                </tbody>
            </table>
        </section>

        <section class="program-cards" classl="sekcjap">
            <h2>Prowadzący:</h2>
            <article class="card teczowy-tekst">
                Prowadzący mgr.GSI
            </article>

            <h2>Drużyny:</h2>
            <article class="card">
                Drużyna: Skrętu przyczepka
            </article>
            <article class="card">
                Drużyna: Raka jąder
            </article>
        </section>

        <section class="program-gallery">
            <figure>
                <img src="głowica.jpg" alt="karta pierwsza trójkąty i kwadraty" loading="lazy" width="400" height="300">
                <figcaption class="zmkolor"><h2>Karta Głowicy</h2></figcaption>
            </figure>

            <figure>
                <img src="przyczepek.jpg" alt="karta pierwsza trójkąty i kwadraty" loading="lazy" width="400" height="300">
                <figcaption class="zmkolor"><h2>Karta Przyczepka</h2></figcaption>
            </figure>

            <figure>
                <img src="rak.jpg" alt="karta pierwsza trójkąty i kwadraty" loading="lazy" width="400" height="300">
                <figcaption class="zmkolor"><h2>Karta Raka</h2></figcaption>
            </figure>
        </section>
    </main>
</body>
</html>
