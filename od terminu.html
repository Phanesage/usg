<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Najbliższy termin</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        table {
            border-collapse: collapse;
            width: 100%;
            max-width: 500px;
            margin-bottom: 20px;
        }
        th, td {
            border: 1px solid #333;
            padding: 10px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
        .galeria {
            display: flex;
            gap: 15px;
            max-width: 500px;
            align-items: flex-start;
        }
        .galeria img {
            height: auto;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
        }
        .img-maly {
            width: 30%;
        }
        .img-duzy {
            width: 70%;
        }
    </style>
</head>
<body>

    <h1>Harmonogram terminów</h1>
    <table>
        <thead>
            <tr>
                <th>Dzień tygodnia</th>
                <th>Godzina</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td><strong>Środa</strong></td>
                <td><strong>7:20</strong></td>
                <td>Najbliższy termin 👌😎😶‍🌫️</td>
            </tr>
            <tr>
                <td>Piątek</td>
                <td>14:00</td>
                <td>Wolny</td>
            </tr>
            <tr>
                <td>Poniedziałek</td>
                <td>10:15</td>
                <td>Zajęty</td>
            </tr>
        </tbody>
    </table>

    <div class="galeria">
        <img class="img-maly" src="George_Floyd.png" alt="Opis zawartości obrazka">
        <img class="img-duzy" src="kaparasa.jpg" alt="Drugi obrazek">
    </div>

</body>
</html>
